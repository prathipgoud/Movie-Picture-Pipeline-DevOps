name: Frontend CI

on:
  push:
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  pull_request:
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd starter/frontend
          npm install

      - name: Format & Lint
        run: |
          cd starter/frontend
          npx prettier --write "src/**/*.{js,jsx,ts,tsx,json,css,scss,md}" || true
          npm run lint --if-present || true

      - name: Run Tests
        env:
          CI: true
        run: |
          cd starter/frontend
          npm test -- --watchAll=false
